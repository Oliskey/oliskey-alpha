# Markets the engine scans. app_id = Oliskey Alpha asset id; provider symbol = where real data comes from.
# Only symbols the current keys can actually fetch are listed (checked 2026-10-30).
classes:
  crypto:    { provider: binance, timeframe: 1h, horizon_bars: 24, cost_pct: 0.15, history_years: 5 }
  # Second crypto test (owner request 2026-10-30): same strategies and rules on 4-hour bars, held up to 24 h.
  # Bigger moves per bar make the fixed trading cost a smaller share of the risk.
  crypto_4h: { provider: binance, timeframe: 4h, horizon_bars: 6, cost_pct: 0.15, history_years: 5, applies_to: crypto }
  currency:  { provider: fmp,     timeframe: 1d, horizon_bars: 10, cost_pct: 0.01 }
  index:     { provider: fmp,     timeframe: 1d, horizon_bars: 10, cost_pct: 0.03 }
  commodity: { provider: fmp,     timeframe: 1d, horizon_bars: 10, cost_pct: 0.04 }

